name: update

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # pin: never build on a stray branch
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl beautifulsoup4

      - name: Build data.json
        run: python3 scripts/build.py

      - name: Commit and push (rebuild-on-main, never merge)
        run: |
          git config user.name  heatsplit-bot
          git config user.email bot@causewaygt.com
          # BOTH outputs must be committed. Until 7 Aug 2026 only
          # data.json was added, so docs/hourly.json was written and
          # then discarded with the runner - the hourly store rebuilt
          # from empty every run and its completeness swung with
          # whichever chunk requests happened to survive.
          git add docs/data.json docs/hourly.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          MSG="data update $(date -u +%F)"
          git commit -m "$MSG"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected - rebuilding on latest main (attempt $i)"
            git fetch origin main
            # keep the freshly generated data.json staged, drop our
            # commit, re-commit on top of whatever main now holds.
            # Generated artefacts are never merged or rebased.
            git reset --soft origin/main
            # BOTH outputs must be committed. Until 7 Aug 2026 only
          # data.json was added, so docs/hourly.json was written and
          # then discarded with the runner - the hourly store rebuilt
          # from empty every run and its completeness swung with
          # whichever chunk requests happened to survive.
          git add docs/data.json docs/hourly.json
            git commit -m "$MSG"
          done
          echo "push failed after 3 attempts"; exit 1
